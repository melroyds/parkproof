<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ParkProof monochrome icon</title>
  <desc id="desc">Single-colour navy ParkProof layered P monogram with integrated alarm clock.</desc>
  <defs>
    <style>
      .serif { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Shadow and front P are merged visually in one colour for single-colour reproduction -->
  <text class="serif" x="154" y="394" font-size="330" fill="#073B25">P</text>
  <text class="serif" x="106" y="344" font-size="330" fill="#073B25">P</text>

  <!-- Clock is knocked out using the background/negative-space colour. Change #F3F6F4 to white if used on pure white. -->
  <g transform="translate(252 185)">
    <path d="M-70,-50 C-94,-44 -102,-22 -94,-4 L-48,-18 C-49,-35 -57,-45 -70,-50Z" fill="#F3F6F4"/>
    <path d="M70,-50 C94,-44 102,-22 94,-4 L48,-18 C49,-35 57,-45 70,-50Z" fill="#F3F6F4"/>
    <circle cx="-82" cy="-57" r="5" fill="#F3F6F4"/>
    <circle cx="82" cy="-57" r="5" fill="#F3F6F4"/>

    <circle cx="0" cy="0" r="82" fill="#F3F6F4"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#073B25" stroke-width="10"/>

    <line x1="0" y1="0" x2="-38" y2="-28" stroke="#073B25" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="45" y2="-34" stroke="#073B25" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#073B25"/>
  </g>
</svg>
