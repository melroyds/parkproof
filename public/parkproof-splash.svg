<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-labelledby="title desc">
  <title id="title">ParkProof splash screen</title>
  <desc id="desc">Premium vault-green ParkProof splash with the Datum P mark and wordmark.</desc>
  <defs>
    <style>.disp { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; }
           .body { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }</style>
    <pattern id="guilloche" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <rect width="22" height="22" fill="#073B25"/>
      <rect width="2" height="22" fill="#7BE3A4" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Vault ground + faint banknote guilloché -->
  <rect width="1290" height="2796" fill="url(#guilloche)"/>

  <!-- Datum P (paper mark, glowing mint datum point + notch) -->
  <g transform="translate(267 838) scale(7)">
    <rect x="27" y="19" width="12.5" height="63" fill="#F3F6F4"/>
    <path fill-rule="evenodd" fill="#F3F6F4" d="M57 13 A24 24 0 1 0 57 61 A24 24 0 1 0 57 13 Z M57 25 A12 12 0 1 1 57 49 A12 12 0 1 1 57 25 Z"/>
    <circle cx="57" cy="37" r="5.5" fill="#7BE3A4"/>
    <path d="M73 20 L80.5 17.5 L77.5 27 Z" fill="#7BE3A4"/>
  </g>

  <!-- Wordmark + tagline -->
  <text class="disp" x="645" y="1640" text-anchor="middle" font-size="150" fill="#F3F6F4" letter-spacing="-5">ParkProof</text>
  <text class="body" x="645" y="1740" text-anchor="middle" font-size="50" fill="#A9CFBE" letter-spacing="0.5">Aussie parking, decoded</text>

  <!-- Signed-record hairline -->
  <line x1="500" y1="2690" x2="790" y2="2690" stroke="#7BE3A4" stroke-width="4" stroke-linecap="round"/>
</svg>
